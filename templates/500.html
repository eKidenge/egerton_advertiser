<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Server Error - The Egerton Advertiser</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Times+New+Roman&display=swap');
        
        body {
            font-family: 'Times New Roman', serif;
            background: #f5f0e8;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .error-container {
            text-align: center;
            padding: 40px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            border: 1px solid #e0e0e0;
            max-width: 600px;
            width: 90%;
        }
        .error-code {
            font-family: 'Playfair Display', serif;
            font-weight: 900;
            font-size: 120px;
            color: #dc3545;
            line-height: 1;
            margin-bottom: 10px;
        }
        .error-icon {
            font-size: 64px;
            color: #dc3545;
            margin-bottom: 20px;
        }
        .error-title {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            font-size: 28px;
            color: #1a3c5e;
            margin-bottom: 10px;
        }
        .error-message {
            font-family: 'Times New Roman', serif;
            font-size: 18px;
            color: #6c757d;
            margin-bottom: 25px;
        }
        .error-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .error-actions .btn {
            font-family: 'Times New Roman', serif;
            font-weight: 700;
            padding: 10px 30px;
            border-radius: 4px;
        }
        .btn-primary {
            background: #1a3c5e;
            border: none;
            color: #fff;
        }
        .btn-primary:hover {
            background: #0e2a44;
        }
        .btn-outline-primary {
            border: 2px solid #1a3c5e;
            color: #1a3c5e;
        }
        .btn-outline-primary:hover {
            background: #1a3c5e;
            color: #fff;
        }
        .error-divider {
            width: 80px;
            height: 3px;
            background: #c9a84c;
            margin: 15px auto;
        }
        .gov-seal {
            margin-bottom: 20px;
        }
        .gov-seal i {
            font-size: 48px;
            color: #1a3c5e;
            opacity: 0.3;
        }
        .error-support {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
        }
        .error-support p {
            font-family: 'Times New Roman', serif;
            font-size: 14px;
            color: #6c757d;
            margin: 0;
        }
        .error-support a {
            color: #1a3c5e;
            text-decoration: none;
        }
        .error-support a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="gov-seal">
            <i class="fas fa-gavel"></i>
        </div>
        <div class="error-code">500</div>
        <div class="error-icon">
            <i class="fas fa-exclamation-circle"></i>
        </div>
        <div class="error-divider"></div>
        <h1 class="error-title">Internal Server Error</h1>
        <p class="error-message">
            Something went wrong on our end. Our technical team has been notified 
            and is working to resolve the issue.
        </p>
        <div class="error-actions">
            <a href="{% url 'home' %}" class="btn btn-primary">
                <i class="fas fa-home"></i> Go Home
            </a>
            <a href="javascript:location.reload()" class="btn btn-outline-primary">
                <i class="fas fa-sync"></i> Try Again
            </a>
            <a href="{% url 'contacts:contact' %}" class="btn btn-outline-primary">
                <i class="fas fa-envelope"></i> Contact Support
            </a>
        </div>
        <div class="error-support">
            <p>
                <i class="fas fa-info-circle"></i> 
                If the problem persists, please <a href="{% url 'contacts:contact' %}">contact our support team</a>
            </p>
            <p class="text-muted mt-1">
                <small>Reference: Error Code #500</small>
            </p>
        </div>
    </div>
</body>
</html>
