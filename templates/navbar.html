<script>
    (function() {
        'use strict';
        
        document.addEventListener('DOMContentLoaded', function() {
            const toggle = document.querySelector('.main-navigation .more-toggle');
            const menu = document.getElementById('moreDropdownMenu');
            
            if (!toggle || !menu) {
                console.warn('Dropdown toggle or menu not found');
                return;
            }
            
            // Toggle dropdown on click
            toggle.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                
                const isOpen = menu.classList.contains('show');
                
                // Close all other custom dropdowns
                document.querySelectorAll('.custom-dropdown-menu.show').forEach(function(m) {
                    if (m !== menu) {
                        m.classList.remove('show');
                    }
                });
                
                if (isOpen) {
                    menu.classList.remove('show');
                    toggle.setAttribute('aria-expanded', 'false');
                } else {
                    menu.classList.add('show');
                    toggle.setAttribute('aria-expanded', 'true');
                    
                    // Position the dropdown on desktop
                    if (window.innerWidth > 991) {
                        const rect = toggle.getBoundingClientRect();
                        menu.style.top = (rect.bottom + 5) + 'px';
                        menu.style.right = (window.innerWidth - rect.right) + 'px';
                    }
                }
            });
            
            // Close dropdown when clicking outside
            document.addEventListener('click', function(e) {
                if (!e.target.closest('.main-navigation .dropdown')) {
                    document.querySelectorAll('.custom-dropdown-menu.show').forEach(function(m) {
                        m.classList.remove('show');
                    });
                    document.querySelectorAll('.main-navigation .dropdown-toggle').forEach(function(t) {
                        t.setAttribute('aria-expanded', 'false');
                    });
                }
            });
            
            // Close dropdown on scroll (desktop only)
            window.addEventListener('scroll', function() {
                if (window.innerWidth > 991) {
                    document.querySelectorAll('.custom-dropdown-menu.show').forEach(function(m) {
                        m.classList.remove('show');
                    });
                    document.querySelectorAll('.main-navigation .dropdown-toggle').forEach(function(t) {
                        t.setAttribute('aria-expanded', 'false');
                    });
                }
            });
        });
    })();
</script>
